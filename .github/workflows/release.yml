name: Release binaries

# Builds the game on each platform when a GitHub release is published and
# attaches a ready-to-run archive (executable + Resources + LICENSE) to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
          - os: macos-latest
            platform: macos-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Package
        run: |
          name="piung-${TAG#v}-${{ matrix.platform }}"
          cmake --install build --config Release --prefix "staging/$name"
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cmake -E tar cf "../$name.zip" --format=zip "$name"
          else
            cmake -E tar czf "../$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
